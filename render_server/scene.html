<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body { background: #f5f3ef; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const SCENE_DATA = window.__SCENE_DATA__ || {};
const rooms   = SCENE_DATA.rooms     || [];
const bounds  = SCENE_DATA.bounds    || { width_m: 10, depth_m: 12 };
const outline = SCENE_DATA.outline_m || [];

const W = 1200, H = 1200;
const WALL_H = 1.5;   // metres — dollhouse height
const WT     = 0.15;  // wall thickness

// ── Renderer ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0ece4);

// ── Camera: NW corner looking SE (matches reference 3D plan) ─────────────
const cx   = bounds.width_m  / 2;
const cz   = bounds.depth_m  / 2;
const span = Math.max(bounds.width_m, bounds.depth_m) * 0.72;
const dist = Math.max(bounds.width_m, bounds.depth_m) * 1.1;

const camera = new THREE.OrthographicCamera(-span, span, span, -span, 0.1, 500);
camera.position.set(cx - dist * 0.7, dist * 1.1, cz - dist * 0.7);
camera.lookAt(cx, 0, cz);

// ── Lighting ──────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff8f0, 0.9));

const sun = new THREE.DirectionalLight(0xfffaf0, 2.2);
sun.position.set(cx + bounds.width_m, 14, cz + bounds.depth_m);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left   = -20;
sun.shadow.camera.right  =  20;
sun.shadow.camera.top    =  20;
sun.shadow.camera.bottom = -20;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xe8eeff, 0.5);
fill.position.set(cx - bounds.width_m, 8, cz + bounds.depth_m);
scene.add(fill);

// ── Materials ─────────────────────────────────────────────────────────────
const matFloor   = new THREE.MeshLambertMaterial({ color: 0xc8a87a }); // warm oak
const matWall    = new THREE.MeshLambertMaterial({ color: 0xf0ece0 }); // warm cream
const matTerrace = new THREE.MeshLambertMaterial({ color: 0xd4cfc8 }); // stone grey

// plan_y → Three.js z:  three_z = plan_depth - plan_y
const planD = bounds.depth_m;

// ── 1. Floor slab per room ────────────────────────────────────────────────
for (const room of rooms) {
  const geo  = new THREE.PlaneGeometry(room.width_m, room.depth_m);
  const mat  = room.is_external ? matTerrace : matFloor;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(
    room.x_m + room.width_m / 2,
    0,
    planD - room.y_m - room.depth_m / 2
  );
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// ── 2. Perimeter walls from outline edges ─────────────────────────────────
// Each edge of the apartment outline becomes one wall segment.
// Wall sits centred on the edge, height = WALL_H, thickness = WT.
for (let i = 0; i < outline.length; i++) {
  const [x1, y1] = outline[i];
  const [x2, y2] = outline[(i + 1) % outline.length];

  const z1 = planD - y1;
  const z2 = planD - y2;
  const dx  = x2 - x1;
  const dz  = z2 - z1;
  const len = Math.sqrt(dx * dx + dz * dz);
  if (len < 0.01) continue;

  const geo  = new THREE.BoxGeometry(len, WALL_H, WT);
  const mesh = new THREE.Mesh(geo, matWall);
  mesh.position.set((x1 + x2) / 2, WALL_H / 2, (z1 + z2) / 2);
  mesh.rotation.y = -Math.atan2(dz, dx);
  mesh.castShadow    = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// ── 3. Shadow catcher ─────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(bounds.width_m * 3, bounds.depth_m * 3),
  new THREE.ShadowMaterial({ opacity: 0.18 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(cx, -0.06, cz);
ground.receiveShadow = true;
scene.add(ground);

// ── Render once then signal ready ─────────────────────────────────────────
renderer.render(scene, camera);
window.__RENDER_DONE__ = true;
</script>
</body>
</html>
